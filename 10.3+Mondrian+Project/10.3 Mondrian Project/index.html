<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
    .Container {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container-grid {
      height: 748px;
      width: 748px;
      display: grid;
      /* gap: 9px; */
      grid-template-columns: 320px 320px 50px;
      grid-template-rows: 414px 414px 20px;
    }
    .one {
      background-color: #E72F24;
      border-bottom: #232629 solid 9px ;
      border-right: #232629  solid 9px;
    }
    .two {
      background-color: #F0F1EC;
      border-bottom: #232629 solid 9px ;
    }
    .three {
      background-color: #F0F1EC;
      border-bottom: #232629 solid 9px ;
    }
    .four {
      background-color: #F0F1EC;
      border-bottom: #232629 solid 9px ;
      border-right: #232629  solid 9px;
    }
    .five {
      background-color: #F0F1EC;
      border-bottom: #232629 solid 9px ;
      border-right: #232629  solid 9px;
    }
    .six{
      display: flex;
      flex-direction: column;
    }
    .seven {
      background-color: #F0F1EC;
      border-right: #232629  solid 9px;
    }
    .eight {
      display: flex;
    }
    .nine{
      background-color: #F0F1EC;
    }
    .blue {
      background-color: #004592;
      height: 130px;
      border-bottom: #232629  solid 9px;
    }
    .white {
      background-color:#F0F1EC ;
      height: 360PX;
    }
    .yellow {
      background-color: #F9D01E;
      width: 198px;
    }
    .black {
      background-color:#232629 ;
      width: 153px;
    }
  </style>
</head>

<body>
  <!-- Write your HTML here -->
   <div class="Container">
    <div class="container-grid">
        <div class="one"></div>
        <div class="two"></div>
        <div class="three"></div>
        <div class="four"></div>
        <div class="five"></div>
        <div class="six">
          <div class="blue"></div>
          <div class="white"></div>
        </div>
        <div class="seven"></div>
        <div class="eight">
          <div class="yellow"></div>
          <div class="black"></div>
        </div>
        <div class="nine"></div>
    </div>
   </div>
</body>

</html>
